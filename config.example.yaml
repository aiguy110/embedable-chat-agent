# LLM Configuration
llm:
  # Provider: 'openai' or 'custom' for OpenAI-compatible APIs
  provider: openai

  # Model name (e.g., 'gpt-4', 'gpt-3.5-turbo', or your custom model)
  model: gpt-4

  # API Key (can also be set via OPENAI_API_KEY environment variable)
  # apiKey: sk-...

  # Base URL for custom OpenAI-compatible APIs (optional)
  # baseURL: https://api.your-provider.com/v1

  # Temperature for response generation (0.0 to 2.0, default: 0.7)
  temperature: 0.7

  # Maximum tokens in response (optional)
  # maxTokens: 2000

# System prompt that defines the agent's behavior
systemPrompt: |
  You are a helpful AI assistant embedded in a web application.
  Provide clear, concise, and friendly responses to user queries.
  If you use tools, explain what you're doing in a user-friendly way.

# MCP Servers Configuration (optional)
# Uncomment and configure MCP servers you want to use
mcpServers:
  # Example: Filesystem MCP server
  # - name: filesystem
  #   command: npx
  #   args:
  #     - -y
  #     - @modelcontextprotocol/server-filesystem
  #     - /path/to/allowed/directory

  # Example: GitHub MCP server
  # - name: github
  #   command: npx
  #   args:
  #     - -y
  #     - @modelcontextprotocol/server-github
  #   env:
  #     GITHUB_PERSONAL_ACCESS_TOKEN: your_token_here

  # Example: Brave Search MCP server
  # - name: brave-search
  #   command: npx
  #   args:
  #     - -y
  #     - @modelcontextprotocol/server-brave-search
  #   env:
  #     BRAVE_API_KEY: your_api_key_here

# CORS Configuration (optional)
cors:
  # Allowed origins for CORS (default: '*' allows all)
  # allowedOrigins:
  #   - https://your-domain.com
  #   - https://another-domain.com
